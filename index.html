<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>BEGAN ALERT ACCESS</title>

  <link rel="manifest" href="./manifest.json?v=3">
  <link rel="apple-touch-icon" href="./assets/icon-512.png?v=2">
  <link rel="stylesheet" href="./style.css?v=3">

  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
    data-began-onesignal-sdk="1"></script>
  <script src="./app.js?v=4" defer></script>
</head>
<body>
  <main class="alert-shell" aria-live="polite">
    <section
      class="auth-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="alertTitle"
      aria-describedby="alertDescription">

      <button id="closeAlert" class="auth-close" type="button" aria-label="Tutup dan kembali ke dashboard">
        ✕
      </button>

      <img
        src="https://pwa.barkahgarment.com/assets/logo-icon-512.png"
        class="began-logo"
        alt="BEGAN">

      <div id="alertTitle" class="auth-title">BEGAN ALERT SYSTEM</div>

      <div id="alertDescription" class="auth-sub">
        Menyiapkan sistem notifikasi...
      </div>

      <button id="enableNotif" type="button" disabled>
        CONNECTING...
      </button>

      <div class="auth-note">
        Halaman ini hanya untuk aktivasi notifikasi. Tekan ✕ kapan saja untuk kembali ke dashboard.
      </div>
    </section>
  </main>
</body>
</html>
